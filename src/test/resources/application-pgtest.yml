# PostgreSQL test profili — H2 ko'rmaydigan xatolarni (nullable parametr tipi, dialekt
# farqlari) ushlash uchun. Default `mvn test` H2 da qoladi.
#
#   mvn test -Dspring.profiles.active=pgtest
#
# `test` profili (application.yml) baribir yoqiladi (TestProfilesResolver) — bu fayl
# faqat bazaga oid qismini ustidan yozadi.
#
# Baza: lokal adizone_test, crm_user. Parol faqat env'dan (DB_PASSWORD), default YO'Q.
# Sxemani Hibernate quradi (create-drop) — bazadagi jadvallar har ishga tushishda
# qayta yaratiladi, shu sababli bu profilni ishchi bazaga ulamang.
spring:
  datasource:
    url: ${PGTEST_DB_URL:jdbc:postgresql://localhost:5432/adizone_test}
    driver-class-name: org.postgresql.Driver
    username: ${PGTEST_DB_USER:crm_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop
    # Skriptlar Hibernate jadvallarni yaratgandan KEYIN bajariladi (V52–V78 ALTER TABLE / UPDATE qiladi).
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      # Prodda qo'lda bajariladigan migratsiyalar AYNAN o'zi: sequence, UNIQUE, partial
      # indekslar va h.k. H2 ning billing-test-schema.sql i bu yerda ishlatilmaydi.
      # Separator — butun fayl bitta statement: DO $$ ... $$ bloklarini ScriptUtils
      # ';' bo'yicha bo'lib yubormasin (pgjdbc ko'p statementli matnni o'zi ajratadi).
      separator: "^^^ END OF SCRIPT ^^^"
      schema-locations:
        - classpath:db/migration/V52__billing_v2.sql
        - classpath:db/migration/V53__director_dashboard.sql
        - classpath:db/migration/V54__payroll_v2.sql
        - classpath:db/migration/V55__payroll_v2_decisions.sql
        - classpath:db/migration/V56__legacy_constraints.sql
        - classpath:db/migration/V57__salary_rule_overlaps.sql
        - classpath:db/migration/V58__phase5_security.sql
        - classpath:db/migration/V59__contract_number_per_year.sql
        - classpath:db/migration/V60__notice_target_roles.sql
        - classpath:db/migration/V61__leaves_substitutions.sql
        - classpath:db/migration/V62__exam_fee.sql
        - classpath:db/migration/V63__settings_contract_snapshot.sql
        - classpath:db/migration/V64__teacher_user_fk_dedupe.sql
        - classpath:db/migration/V65__homework_group_transfer.sql
        - classpath:db/migration/V66__telegram_miniapp.sql
        - classpath:db/migration/V67__user_onboarding.sql
        - classpath:db/migration/V68__app_link_requests_teacher.sql
        - classpath:db/migration/V69__absence_notices.sql
        - classpath:db/migration/V70__chat_external_outbox.sql
        - classpath:db/migration/V71__user_notifications.sql
        - classpath:db/migration/V72__teacher_kpi_monthly.sql
        - classpath:db/migration/V73__student_status_from_enrollments.sql
        - classpath:db/migration/V74__teacher_kpi_monthly_unique.sql
        - classpath:db/migration/V75__grace_until_due_date.sql
        - classpath:db/migration/V76__period_end_anchor_day.sql
        - classpath:db/migration/V77__billing_held_applications.sql
        - classpath:db/migration/V78__bank_to_terminal.sql
        - classpath:db/migration/V79__lead_task_required_student_source.sql
        - classpath:pgtest-schema.sql

app:
  schema:
    # Prod bilan bir xil: PostgreSQL da enum CHECK larni tozalovchi ishlaydi.
    drop-enum-checks: true
