spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=MONTH,YEAR,VALUE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Billing v2: chek sequence'i — prodda V52__billing_v2.sql yaratadi.
  sql:
    init:
      mode: always
      schema-locations: classpath:billing-test-schema.sql

app:
  schema:
    # Testlar H2 da ishlaydi — PL/pgSQL blokini bajarib bo'lmaydi.
    drop-enum-checks: false
  billing:
    # Testlar soatni o'zi boshqaradi — startup accrual aralashmasin.
    startup-catch-up: false
  contracts:
    # Muzlatilgan shartnoma PDF lari (ContractPdfService) — test artefaktlari target/ ichida qoladi.
    pdf-dir: target/test-uploads/contracts

meta:
  enabled: false

telegram:
  enabled: false

jwt:
  secret: f4ba5620b4a9e1f27d78beb236150ec150b59cf04fc234858d24b68128159e32  # faqat testlar uchun, prod kalitiga aloqasi yo'q
  expiration: 86400000
  refresh-expiration: 604800000
