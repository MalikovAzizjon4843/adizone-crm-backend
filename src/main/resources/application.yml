spring:
  application:
    name: crm-system

  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 8MB

  datasource:
    url: jdbc:postgresql://localhost:5432/adizone
    username: postgres
    password: root123
#    sercet '@dizone_Crm_2026$$'
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # update: yo‘q jadval/ustunlarni yaratadi va mavjud sxemani entity bo‘yicha yangilaydi; ustun/jadvalni o‘chirmaydi.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  audit:
    # false — AuditAspect umuman yuklanmaydi, hech narsa loglanmaydi
    enabled: true
    # Shu kundan eski loglar har kecha 03:30 da o'chiriladi (0 — hech qachon)
    retention-days: 90
  upload:
    dir: /opt/crm/uploads
  base-url: https://api.adizone.uz
  schema:
    # Hibernate yaratgan enum CHECK constraint'larni startup'da o'chiradi.
    # ddl-auto: update ularni yangilamaydi, natijada yangi enum qiymati bazada rad etiladi.
    drop-enum-checks: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 28800000  # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

logging:
  level:
    com.crm: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

