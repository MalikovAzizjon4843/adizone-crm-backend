# Sirlar faqat muhit o'zgaruvchilaridan olinadi va default qiymati YO'Q —
# biror o'zgaruvchi berilmasa ilova startda to'xtaydi. Ro'yxat va
# o'rnatish tartibi: docs/ops/env.md
spring:
  application:
    name: crm-system

  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 8MB

  datasource:
    url: jdbc:postgresql://localhost:5432/adizone
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    # JSON'dagi sana/vaqt (Date, Instant → matn) Toshkent bo'yicha. LocalDate/LocalDateTime zonasiz.
    time-zone: Asia/Tashkent

  jpa:
    hibernate:
      # update: yo‘q jadval/ustunlarni yaratadi va mavjud sxemani entity bo‘yicha yangilaydi; ustun/jadvalni o‘chirmaydi.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          # JDBC orqali vaqt qiymatlari Toshkent zonasida (docs/ops/timezone.md).
          time_zone: Asia/Tashkent
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  audit:
    # false — AuditAspect umuman yuklanmaydi, hech narsa loglanmaydi
    enabled: true
    # Har kecha 03:30 da o'chiriladi (0 — hech qachon). Q14: oddiy 180, moliyaviy 365 kun.
    # Moliyaviy = amal PAYMENT/PAYMENT_CANCEL/REFUND yoki obyekt Payment/Payroll/Cash*/Balance/...
    # (ro'yxat — AuditProperties.financialActions / financialEntityTypes).
    retention-days: 180
    financial-retention-days: 365
  upload:
    dir: /opt/crm/uploads
  # Oylik (docs/design/payroll-v2.md §11). cutover-date bo'sh — qo'llangan billing migratsiyasidan olinadi.
  payroll:
    # cutover-date: 2026-10-01   (yoki env APP_PAYROLL_CUTOVER_DATE)
    count-discount-covered: false
  base-url: https://api.adizone.uz
  schema:
    # Hibernate yaratgan enum CHECK constraint'larni startup'da o'chiradi.
    # ddl-auto: update ularni yangilamaydi, natijada yangi enum qiymati bazada rad etiladi.
    drop-enum-checks: true
  attendance:
    # O'tgan kun davomatini ochish ruxsati (APPROVED) reviewedAt dan shuncha soat amal qiladi.
    unlock-valid-hours: 48
  # Direktor dashboardi (docs/design/director-dashboard.md). Qolgan sozlamalar — DashboardProperties default'lari.
  dashboard:
    digest:
      # Kunlik Telegram xulosasi (§5) — default O'CHIQ; chat id lar faqat env'dan
      enabled: ${DIRECTOR_DIGEST_ENABLED:false}
      cron: "0 0 20 * * *"
      chat-ids: ${DIRECTOR_DIGEST_CHAT_IDS:}
      dashboard-url: ${DIRECTOR_DASHBOARD_URL:}

jwt:
  secret: ${JWT_SECRET}
  expiration: 28800000  # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

logging:
  level:
    com.crm: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Meta (Facebook/Instagram) Lead Ads integratsiyasi.
# Uchta sir uchta har xil narsa:
#   system-user-token - Business Manager System User tokeni (Graph API uchun)
#   app-secret        - webhook imzosini tekshirish uchun (Graph ga aloqasi yo'q)
#   verify-token      - webhook ni ro'yxatdan o'tkazishdagi qo'l berish (o'zimiz o'ylaymiz)
meta:
  # false - webhook 200 qaytaradi (Meta obunani o'chirmasin), lekin
  # scheduler ishlamaydi va Graph so'rovlari yuborilmaydi.
  enabled: true
  api-version: v21.0
  page-id: "972371302634487"
  system-user-token: "${META_SYSTEM_USER_TOKEN}"
  app-secret: "${META_APP_SECRET}"
  verify-token: "${META_VERIFY_TOKEN}"
  graph-base-url: https://graph.facebook.com
  # false - webhook imzosi TEKSHIRILMAYDI va endpoint har kimga ochiq
  # qoladi. Faqat app-secret hali yo'q paytda, sinov uchun. Har so'rovda
  # log ga warning yoziladi.
  verify-signature: true
  # Avtomatik vazifa kimga biriktiriladi. Meta lidi biriktirilmagan holda
  # tug'iladi, tasks.assigned_to esa NOT NULL - ya'ni mas'ulsiz vazifa
  # yaratib bo'lmaydi. Bo'sh qolsa autoCreateTask shunchaki ishlamaydi
  # (log ga ogohlantirish tushadi), lid esa baribir yaratiladi.
  task-assignee-user-id:
  # Sahifa tokeni keshda shuncha soat turadi.
  page-token-ttl-hours: 6
  # Telefon bo'yicha takroriy murojaatni shuncha kun ichida qidiramiz.
  duplicate-window-days: 30
  request-timeout-seconds: 20

telegram:
  # Sir — faqat env (docs/ops/env.md). Bo'sh qoldirish mumkin.
  bot-token: "${TELEGRAM_BOT_TOKEN:}"
  # Token bo'sh bo'lsa Telegram o'chiq ishlaydi (xabar yuborilmaydi, xato yo'q) — TelegramService.
  enabled: ${TELEGRAM_ENABLED:true}
  # Bot webhook (docs/design/telegram-platform.md §1). Sir — faqat env, ≥ 32 belgi [A-Za-z0-9_-].
  # Bo'sh bo'lsa POST /api/telegram/webhook har doim 401 (himoyasiz ishlamaydi).
  webhook-secret: "${TELEGRAM_WEBHOOK_SECRET:}"
  # POST /api/admin/telegram/set-webhook shu manzilni Telegram'ga beradi.
  webhook-url: ${TELEGRAM_WEBHOOK_URL:https://api.adizone.uz/api/telegram/webhook}
  # /start dagi "Ilovani ochish" (web_app) tugmasi.
  webapp-url: ${TELEGRAM_WEBAPP_URL:https://webapp.adizone.uz}
  # O'quvchi/ota-ona Mini App (docs/design/miniapp-api.md). JWT kaliti admin JWT_SECRET dan ALOHIDA;
  # bo'sh yoki < 32 bayt bo'lsa POST /api/app/auth → 503 app.auth.notConfigured.
  app:
    jwt-secret: "${TELEGRAM_APP_JWT_SECRET:}"
    token-ttl: 30m
    init-data-max-age: 1h
