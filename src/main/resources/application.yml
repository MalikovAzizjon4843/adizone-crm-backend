# Sirlar faqat muhit o'zgaruvchilaridan olinadi va default qiymati YO'Q —
# biror o'zgaruvchi berilmasa ilova startda to'xtaydi. Ro'yxat va
# o'rnatish tartibi: docs/ops/env.md
spring:
  application:
    name: crm-system

  servlet:
    multipart:
      # 50MB — qo'ng'iroq yozuvi (app.calls.recording-max-bytes, docs/design/calls.md §10). Boshqa yuklashlar o'z
      # chegarasini servisda tekshiradi (FileStorageService.MAX_BYTES = 4MB) — bu yerdagi qiymat faqat yuqori to'siq.
      max-file-size: 50MB
      max-request-size: 52MB

  datasource:
    url: jdbc:postgresql://localhost:5432/adizone
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    # JSON'dagi sana/vaqt (Date, Instant → matn) Toshkent bo'yicha. LocalDate/LocalDateTime zonasiz.
    time-zone: Asia/Tashkent

  jpa:
    hibernate:
      # update: yo‘q jadval/ustunlarni yaratadi va mavjud sxemani entity bo‘yicha yangilaydi; ustun/jadvalni o‘chirmaydi.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          # JDBC orqali vaqt qiymatlari Toshkent zonasida (docs/ops/timezone.md).
          time_zone: Asia/Tashkent
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  audit:
    # false — AuditAspect umuman yuklanmaydi, hech narsa loglanmaydi
    enabled: true
    # Har kecha 03:30 da o'chiriladi (0 — hech qachon). Q14: oddiy 180, moliyaviy 365 kun.
    # Moliyaviy = amal PAYMENT/PAYMENT_CANCEL/REFUND yoki obyekt Payment/Payroll/Cash*/Balance/...
    # (ro'yxat — AuditProperties.financialActions / financialEntityTypes).
    retention-days: 180
    financial-retention-days: 365
  upload:
    dir: /opt/crm/uploads
  # Oylik (docs/design/payroll-v2.md §11). cutover-date bo'sh — qo'llangan billing migratsiyasidan olinadi.
  payroll:
    # cutover-date: 2026-10-01   (yoki env APP_PAYROLL_CUTOVER_DATE)
    count-discount-covered: false
  base-url: https://api.adizone.uz
  schema:
    # Hibernate yaratgan enum CHECK constraint'larni startup'da o'chiradi.
    # ddl-auto: update ularni yangilamaydi, natijada yangi enum qiymati bazada rad etiladi.
    drop-enum-checks: true
  attendance:
    # O'tgan kun davomatini ochish ruxsati (APPROVED) reviewedAt dan shuncha soat amal qiladi.
    unlock-valid-hours: 48
  tasks:
    reminder:
      # Vazifa muddati eslatmasi (TaskDeadlineReminderJob, docs/design/notifications.md §4): qo'ng'iroqcha
      # egasiga — 1 soat qolganda va muddati o'tganda. false — o'chiq.
      enabled: ${APP_TASK_REMINDER_ENABLED:true}
      cron: "0 */15 * * * *"
  # O'quvchi / ota-onaga bot xabarlari (NotifyProperties, docs/design/notifications.md §4.1) — standart O'CHIQ.
  # O'chiq: outbox'ga yozilmaydi, faqat log. Xodimlar qo'ng'iroqchasiga ta'sir qilmaydi.
  notify:
    student-absent:
      enabled: ${APP_NOTIFY_STUDENT_ABSENT_ENABLED:false}
    payment-overdue:
      enabled: ${APP_NOTIFY_PAYMENT_OVERDUE_ENABLED:false}
      # Qayta yuborish oralig'i (kun): OVERDUE kuni va keyin har shuncha kunda; 1 — har kuni.
      # Bir kunda bittadan ko'p emas (dedupe pay:{studentId}:{sana}).
      repeat-days: ${APP_NOTIFY_PAYMENT_OVERDUE_REPEAT_DAYS:1}
    # "To'lov yaqinlashdi": keyingi to'lov sanasi = bugun + days-before (PaymentDueSoonJob)
    payment-due-soon:
      enabled: ${APP_NOTIFY_PAYMENT_DUE_SOON_ENABLED:false}
      days-before: ${APP_NOTIFY_PAYMENT_DUE_SOON_DAYS_BEFORE:3}
      cron: "0 0 10 * * *"
    # Dars eslatmasi: boshlanishidan minutes-before daqiqa oldin, har 15 daqiqa (LessonReminderJob)
    lesson-reminder:
      enabled: ${APP_NOTIFY_LESSON_REMINDER_ENABLED:false}
      minutes-before: ${APP_NOTIFY_LESSON_REMINDER_MINUTES_BEFORE:120}
      cron: "0 */15 * * * *"
    # E'lon auditoriyasida STUDENT / PARENT bo'lsa — ulangan o'quvchi / ota-onaga bot
    notice-to-students:
      enabled: ${APP_NOTIFY_NOTICE_TO_STUDENTS_ENABLED:false}
  # Taklif va shikoyatlar — murojaatlar (AppealProperties, docs/design/telegram-platform.md §12). Buyurtmachi hali
  # tasdiqlamagan standartlar. enabled=false: bot tugmasi va /taklif yo'q, Mini App'da yangi murojaat/xabar 403;
  # CRM'da mavjudlarini ko'rish va javob berish ishlaydi.
  appeals:
    enabled: ${APP_APPEALS_ENABLED:true}
    daily-limit: ${APP_APPEALS_DAILY_LIMIT:5}
    text-max: ${APP_APPEALS_TEXT_MAX:3000}
    state-ttl-minutes: ${APP_APPEALS_STATE_TTL_MINUTES:30}
    number-prefix: ${APP_APPEALS_NUMBER_PREFIX:MRJ}
    notify-sender-on-close: ${APP_APPEALS_NOTIFY_SENDER_ON_CLOSE:true}
  # "Adizone Qo'ng'iroqlar" — xodimlar telefonidagi qo'ng'iroqlar CRM'da (CallsProperties, docs/design/calls.md §9)
  calls:
    # Notanish raqamdan kiruvchi / javobsiz qo'ng'iroq → avtomatik lid (manba PHONE_CALL, mas'ul — qurilma egasi)
    auto-lead: ${APP_CALLS_AUTO_LEAD:true}
    # Ilovada "CRM'da ochish": crm-web-url + lookup.crmPath (register / heartbeat settings, app/settings)
    crm-web-url: ${APP_CRM_WEB_URL:https://admin.adizone.uz}
    # Yozuvlar katalogi — ochiq /api/files/** pastki katalogni bermaydi
    recording-dir: ${APP_CALLS_RECORDING_DIR:${app.upload.dir}/calls}
    recording-max-bytes: ${APP_CALLS_RECORDING_MAX_BYTES:52428800}
    # Fayl qo'ng'iroqdan shuncha kun o'tib o'chadi, metama'lumot qoladi; 0 — hech qachon
    recording-retention-days: ${APP_CALLS_RECORDING_RETENTION_DAYS:180}
    retention-cron: "0 10 4 * * *"
    sync-max-batch: 200
    sync-max-age-days: ${APP_CALLS_SYNC_MAX_AGE_DAYS:30}
    request-ttl-seconds: ${APP_CALLS_REQUEST_TTL_SECONDS:120}
    request-poll-seconds: ${APP_CALLS_REQUEST_POLL_SECONDS:15}
    lookup-cache-seconds: 30
    recording-link-ttl-seconds: 600
    app:
      latest-version: ${APP_CALLS_APP_LATEST_VERSION:1.0.0}
      min-supported-version: ${APP_CALLS_APP_MIN_VERSION:1.0.0}
      apk-url: ${APP_CALLS_APP_APK_URL:}
    # FCM push (CRM'dan qo'ng'iroq so'rovi) — standart O'CHIQ: ilova pending'ni so'rab turadi.
    # credentials-file — Firebase service account JSON (sir, repoda emas).
    fcm:
      enabled: ${APP_CALLS_FCM_ENABLED:false}
      project-id: ${APP_CALLS_FCM_PROJECT_ID:}
      credentials-file: ${APP_CALLS_FCM_CREDENTIALS_FILE:}
  # Direktor dashboardi (docs/design/director-dashboard.md). Qolgan sozlamalar — DashboardProperties default'lari.
  dashboard:
    digest:
      # Kunlik Telegram xulosasi (§5) — default O'CHIQ; chat id lar faqat env'dan
      enabled: ${DIRECTOR_DIGEST_ENABLED:false}
      cron: "0 0 20 * * *"
      chat-ids: ${DIRECTOR_DIGEST_CHAT_IDS:}
      dashboard-url: ${DIRECTOR_DASHBOARD_URL:}

jwt:
  secret: ${JWT_SECRET}
  expiration: 28800000  # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

logging:
  level:
    com.crm: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Meta (Facebook/Instagram) Lead Ads integratsiyasi.
# Uchta sir uchta har xil narsa:
#   system-user-token - Business Manager System User tokeni (Graph API uchun)
#   app-secret        - webhook imzosini tekshirish uchun (Graph ga aloqasi yo'q)
#   verify-token      - webhook ni ro'yxatdan o'tkazishdagi qo'l berish (o'zimiz o'ylaymiz)
meta:
  # false - webhook 200 qaytaradi (Meta obunani o'chirmasin), lekin
  # scheduler ishlamaydi va Graph so'rovlari yuborilmaydi.
  enabled: true
  api-version: v21.0
  page-id: "972371302634487"
  system-user-token: "${META_SYSTEM_USER_TOKEN}"
  app-secret: "${META_APP_SECRET}"
  verify-token: "${META_VERIFY_TOKEN}"
  graph-base-url: https://graph.facebook.com
  # false - webhook imzosi TEKSHIRILMAYDI va endpoint har kimga ochiq
  # qoladi. Faqat app-secret hali yo'q paytda, sinov uchun. Har so'rovda
  # log ga warning yoziladi.
  verify-signature: true
  # Avtomatik vazifa kimga biriktiriladi. Meta lidi biriktirilmagan holda
  # tug'iladi, tasks.assigned_to esa NOT NULL - ya'ni mas'ulsiz vazifa
  # yaratib bo'lmaydi. Bo'sh qolsa autoCreateTask shunchaki ishlamaydi
  # (log ga ogohlantirish tushadi), lid esa baribir yaratiladi.
  task-assignee-user-id:
  # Sahifa tokeni keshda shuncha soat turadi.
  page-token-ttl-hours: 6
  # Telefon bo'yicha takroriy murojaatni shuncha kun ichida qidiramiz.
  duplicate-window-days: 30
  request-timeout-seconds: 20

telegram:
  # Sir — faqat env (docs/ops/env.md). Bo'sh qoldirish mumkin.
  bot-token: "${TELEGRAM_BOT_TOKEN:}"
  # Token bo'sh bo'lsa Telegram o'chiq ishlaydi (xabar yuborilmaydi, xato yo'q) — TelegramOutboxWorker, HttpTelegramBotApi.
  enabled: ${TELEGRAM_ENABLED:true}
  # Bot webhook (docs/design/telegram-platform.md §1). Sir — faqat env, ≥ 32 belgi [A-Za-z0-9_-].
  # Bo'sh bo'lsa POST /api/telegram/webhook har doim 401 (himoyasiz ishlamaydi).
  webhook-secret: "${TELEGRAM_WEBHOOK_SECRET:}"
  # POST /api/admin/telegram/set-webhook shu manzilni Telegram'ga beradi.
  webhook-url: ${TELEGRAM_WEBHOOK_URL:https://api.adizone.uz/api/telegram/webhook}
  # /start dagi "Ilovani ochish" (web_app) tugmasi.
  webapp-url: ${TELEGRAM_WEBAPP_URL:https://webapp.adizone.uz}
  # O'quvchi/ota-ona Mini App (docs/design/miniapp-api.md). JWT kaliti admin JWT_SECRET dan ALOHIDA;
  # bo'sh yoki < 32 bayt bo'lsa POST /api/app/auth → 503 app.auth.notConfigured.
  app:
    jwt-secret: "${TELEGRAM_APP_JWT_SECRET:}"
    token-ttl: 30m
    init-data-max-age: 1h
